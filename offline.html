<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Alessandro Mainardi</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preload" href="/assets/fonts/plusjakartasans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/jetbrainsmono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .offline-hero {
        min-height: 85vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 2rem;
      }
      .offline-code {
        font-family: var(--font-mono);
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 700;
        line-height: 1.1;
        margin: 0;
        background: linear-gradient(180deg, #38bdf8 0%, rgba(56, 189, 248, 0.4) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .offline-msg {
        font-size: clamp(1.2rem, 3vw, 1.8rem);
        color: var(--text-color);
        margin: 1.25rem 0 0.5rem;
      }
      .offline-desc {
        color: var(--text-muted);
        max-width: 480px;
        margin: 0 0 2rem;
        line-height: 1.6;
        font-size: 0.95rem;
      }
      .offline-status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(245, 158, 11, 0.12);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.3);
        border-radius: 9999px;
        padding: 0.35rem 0.85rem;
        font-size: 0.82rem;
        font-family: var(--font-mono);
        margin-bottom: 1.25rem;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #f59e0b;
        box-shadow: 0 0 8px #f59e0b;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <a href="/" class="logo">am.<span>dev</span></a>
      <div class="header-right">
        <a href="/" class="btn-terminal">Home</a>
      </div>
    </header>

    <main class="offline-hero">
      <div class="offline-status">
        <span class="status-dot"></span>
        <span>Offline Mode · Service Worker Active</span>
      </div>
      <h1 class="offline-code">You Are Offline</h1>
      <p class="offline-msg">No Internet Connection Detected</p>
      <p class="offline-desc">
        You are currently disconnected, but the core portfolio assets are safely cached on your device. Reconnect or try refreshing.
      </p>
      <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
        <button onclick="window.location.reload();" class="btn btn-primary" style="cursor: pointer;">
          Retry Connection
        </button>
        <a href="/" class="btn btn-secondary">
          Return to Portfolio
        </a>
      </div>
    </main>

    <script>
      window.addEventListener('online', function() {
        window.location.reload();
      });
    </script>
  </body>
</html>
